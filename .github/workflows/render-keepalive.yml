name: Render 24/7 Keep-Alive

on:
  schedule:
    # Triggers every 10 minutes (Render free tier sleeps after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DepositShield Render Endpoint
        run: |
          echo "Sending keep-alive ping to DepositShield on Render..."
          RESPONSE=$(curl -s -w "%{http_code}" -o /dev/null "https://depositshield.onrender.com/health")
          echo "HTTP Response Code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "DepositShield is active and awake!"
          else
            echo "Wake up call sent to Render instance (Status: $RESPONSE)"
          fi
